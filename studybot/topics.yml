- id: linux-win-arch-01
  title: Monolithic vs Hybrid Kernel Foundations
  summary: Compare Linux monolithic kernel modules with Windows NT hybrid architecture.
  linux_focus: Kernel module loading path and syscall flow.
  windows_focus: Executive, kernel mode layers, and object manager relationship.
  practice: Draw a side-by-side kernel path diagram for process creation.
  reading_links:
    - https://www.kernel.org/doc/html/latest/
    - https://learn.microsoft.com/windows-hardware/drivers/kernel/

- id: linux-win-arch-02
  title: User Mode and Kernel Mode Transitions
  summary: Understand privilege transitions and syscall handling in both OS families.
  linux_focus: syscall ABI, seccomp, and context switch cost.
  windows_focus: ntdll stubs, system service dispatch table basics.
  practice: Trace one file open path on each platform.
  reading_links:
    - https://man7.org/linux/man-pages/man2/syscall.2.html
    - https://learn.microsoft.com/windows/win32/sysinfo/about-windows-system-architecture

- id: fs-01
  title: ext4 Metadata Design vs NTFS MFT
  summary: Compare inode-based metadata and MFT-based metadata indexing.
  linux_focus: inode, journal, and block group behavior.
  windows_focus: MFT entries, attributes, and USN journal overview.
  practice: List 5 metadata operations and map where they are stored.
  reading_links:
    - https://ext4.wiki.kernel.org/
    - https://learn.microsoft.com/windows/win32/fileio/file-systems

- id: fs-02
  title: Journaling and Crash Recovery
  summary: Study consistency guarantees after sudden power loss.
  linux_focus: ext4 journaling modes (ordered, writeback, journal).
  windows_focus: NTFS logging and transaction recovery concepts.
  practice: Simulate crash-recovery sequence conceptually for both.
  reading_links:
    - https://www.kernel.org/doc/html/latest/filesystems/ext4/
    - https://learn.microsoft.com/windows/win32/fileio/master-file-table

- id: proc-01
  title: Linux Process Model vs Windows Process/Thread Objects
  summary: Compare task_struct model with Windows process and thread objects.
  linux_focus: fork/exec model, PID namespace basics.
  windows_focus: process handles, token association, thread scheduling entities.
  practice: Write lifecycle steps from creation to termination.
  reading_links:
    - https://man7.org/linux/man-pages/man2/fork.2.html
    - https://learn.microsoft.com/windows/win32/procthread/processes-and-threads

- id: proc-02
  title: Scheduling Classes and Priorities
  summary: Understand scheduling strategies and fairness vs responsiveness tradeoffs.
  linux_focus: CFS, real-time classes, nice levels.
  windows_focus: priority classes, dynamic boost behavior.
  practice: Compare latency-sensitive workload tuning knobs.
  reading_links:
    - https://www.kernel.org/doc/html/latest/scheduler/
    - https://learn.microsoft.com/windows/win32/procthread/scheduling-priorities

- id: svc-01
  title: systemd Units vs Windows Services
  summary: Compare service definition, dependency model, and lifecycle control.
  linux_focus: unit files, targets, restart policy.
  windows_focus: SCM database, service states, recovery actions.
  practice: Build equivalent service config examples.
  reading_links:
    - https://www.freedesktop.org/software/systemd/man/systemd.service.html
    - https://learn.microsoft.com/windows/win32/services/services

- id: svc-02
  title: Boot Targets vs Boot Configuration Data
  summary: Contrast boot flow configuration and boot-time service startup.
  linux_focus: boot loader to systemd target transition.
